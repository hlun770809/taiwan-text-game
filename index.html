<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>平凡青年異聞錄 · 抉擇之眼</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
        }
        .game-container {
            max-width: 720px;
            width: 100%;
            background: #0f1219;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 24px 20px;
            border: 1px solid #2e3a4a;
        }
        .stats-panel {
            background: #1e2636;
            border-radius: 48px;
            padding: 20px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 12px 8px;
            border: 1px solid #3c4b5e;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 5px #0a0c12;
            position: relative;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a3442;
            padding: 8px 18px;
            border-radius: 40px;
            border-left: 4px solid;
            font-weight: bold;
            font-size: 1.1rem;
            color: #f0e9d8;
            box-shadow: 0 4px 0 #0b0e13;
        }
        .stat-coin { border-left-color: #f5b342; }
        .stat-stamina { border-left-color: #4ac7a2; }
        .stat-mind { border-left-color: #9f7aea; }
        .stat-value {
            min-width: 48px;
            text-align: center;
            background: #1d2532;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
        }
        .preview-eye {
            background: #2a3442;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: help;
            border: 2px solid #9f7aea;
            box-shadow: 0 4px 0 #0b0e13;
            transition: 0.1s;
        }
        .preview-eye.active {
            background: #9f7aea;
            color: #1a1e2b;
            border-color: #f5b342;
        }
        .event-window {
            background: #1b2330;
            border-radius: 48px;
            padding: 30px 24px;
            border: 1px solid #37465b;
            box-shadow: inset 0 0 15px #0a0e14, 0 10px 10px rgba(0,0,0,0.3);
            margin-bottom: 24px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
        }
        .event-desc {
            color: #e6dacf;
            font-size: 1.2rem;
            line-height: 1.6;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 20px;
            text-shadow: 0 2px 3px black;
        }
        .event-tag {
            align-self: flex-end;
            background: #2d3f4f;
            padding: 5px 16px;
            border-radius: 50px;
            color: #bdd9f0;
            font-size: 0.8rem;
            border: 1px solid #5f7a97;
        }
        .options-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }
        .option-btn {
            background: #283244;
            border: none;
            border-radius: 60px;
            padding: 18px 22px;
            font-size: 1.1rem;
            text-align: left;
            color: #f2e5d4;
            border-left: 8px solid #6c5b7b;
            box-shadow: 0 6px 0 #121722, 0 8px 12px black;
            transition: 0.07s ease;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
        }
        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #121722, 0 5px 10px black;
        }
        .reset-btn {
            background: #393e5c;
            border: none;
            border-radius: 50px;
            padding: 16px 26px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0e9db;
            box-shadow: 0 5px 0 #1d2232;
            cursor: pointer;
            transition: 0.07s ease;
            width: fit-content;
            margin: 10px auto 0;
            border: 1px solid #7f8aa8;
            letter-spacing: 1px;
        }
        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1d2232;
        }
        .footer-note {
            color: #5f6f82;
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            border-top: 1px dashed #2f3e52;
            padding-top: 16px;
        }
        @media (max-width: 450px) {
            .stat-item { font-size: 0.9rem; padding: 6px 12px; }
            .event-desc { font-size: 1rem; }
            .option-btn { padding: 15px 18px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats-panel">
        <div class="stat-item stat-coin">💰金幣 <span class="stat-value" id="statCoin">50</span></div>
        <div class="stat-item stat-stamina">⚡體力 <span class="stat-value" id="statStamina">50</span></div>
        <div class="stat-item stat-mind">🧠精神 <span class="stat-value" id="statMind">50</span></div>
        <div class="preview-eye" id="previewEye" title="預知狀態：關閉">👁️</div>
    </div>
    <div class="event-window">
        <div class="event-desc" id="eventDesc">載入故事中⋯⋯</div>
        <div class="event-tag" id="eventTag">✨ 平凡啟程</div>
    </div>
    <div class="options-area" id="optionsArea"></div>
    <button class="reset-btn" id="resetGameBtn">🔄 重新開始 · 異聞錄</button>
    <div class="footer-note">🔥 選項呼應事件 · 預知眼時隱時現 · 數十種結局</div>
</div>

<script>
(function() {
    // ---------- 遊戲狀態 ----------
    let state = {
        coin: 50,
        stamina: 50,
        mind: 50,
        currentEventId: 'M1',
        showEffectPreview: false,      // 是否在按鈕上顯示增減數值
    };

    // ---------- 事件資料庫 ----------
    const eventDB = new Map();

    // ---------- 輔助函式 ----------
    const randElem = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // 條件檢查
    function checkCondition(conditionStr) {
        if (!conditionStr) return true;
        try {
            const func = new Function('coin', 'stamina', 'mind', `return ${conditionStr};`);
            return func(state.coin, state.stamina, state.mind);
        } catch (e) {
            console.warn('條件錯誤', conditionStr);
            return true;
        }
    }

    // 動態效果 (依屬性微調)
    function computeEffect(baseEffect) {
        if (!baseEffect) return { coin:0, stamina:0, mind:0 };
        let eff = { ...baseEffect };
        if (eff.coin && typeof eff.coin === 'number') {
            if (state.coin > 200 && eff.coin < 0) eff.coin = Math.floor(eff.coin * 1.5);
            if (state.mind < 20 && eff.mind < 0) eff.mind = Math.floor(eff.mind * 1.3);
        }
        return eff;
    }

    // ---------- 選項文本庫 (按標籤區分) ----------
    const optionTextsByTag = {
        '恐怖': ['👁️ 查看動靜', '🏃 逃離這裡', '🙈 閉眼不理', '🔦 拿出手機照亮', '📿 默念經文', '🕯️ 點燃火柴'],
        '搞笑': ['😂 跟著大笑', '📱 拍片上傳', '🤷 裝作沒看見', '🎭 加入他們一起鬧', '🍌 踢開香蕉皮', '📢 大聲吐槽'],
        '暗黑': ['😈 順從黑暗', '🌟 奮力抵抗', '🤔 暗中觀察', '📝 記下一切', '🔪 先發制人', '🕳️ 躲進角落'],
        '誘惑': ['💋 接受誘惑', '🚫 嚴詞拒絕', '💸 試著殺價', '🏃 轉身就跑', '🤝 假裝配合', '💊 要求試用'],
        '獵奇': ['🔍 靠近查看', '😱 尖叫逃離', '📦 撿回家', '📞 報警處理', '🧪 取樣研究', '🚫 不理會'],
        '時事': ['📰 追蹤最新發展', '💬 上網帶風向', '🚶 冷眼旁觀', '🤝 參加集會', '📉 預測股市', '🧻 囤貨']
    };

    // 效果模板
    const effectTemplates = [
        { coin: 5, stamina: -2, mind: 1 },
        { coin: -8, stamina: 3, mind: -3 },
        { coin: 15, stamina: -5, mind: -5 },
        { coin: -3, stamina: -1, mind: 8 },
        { coin: 20, stamina: -10, mind: -2 },
        { coin: -12, stamina: 6, mind: 6 },
        { coin: 0, stamina: -6, mind: -6 },
        { coin: 7, stamina: 0, mind: -4 },
        { coin: -5, stamina: 4, mind: 2 },
        { coin: 10, stamina: -3, mind: -7 }
    ];

    // 生成選項 (帶有對應標籤的文字、條件、可能切換預知眼)
    function createOptionsForEvent(tag, count, baseTargetFunc) {
        const pool = optionTextsByTag[tag] || optionTextsByTag['恐怖']; // 預設
        // 隨機選取不重複的文本 (若count大於池子長度則重複)
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        const selectedTexts = [];
        for (let i = 0; i < count; i++) {
            selectedTexts.push(shuffled[i % shuffled.length]);
        }

        const options = [];
        for (let i = 0; i < count; i++) {
            const effect = randElem(effectTemplates);
            const target = baseTargetFunc(i); // 根據索引決定目標
            // 隨機決定是否為切換預知眼的選項 (機率8%)
            const togglePreview = Math.random() < 0.08; 
            // 隨機條件 (部分選項有門檻)
            let condition = null;
            if (Math.random() < 0.3) { // 30%機率帶條件
                if (tag === '恐怖') condition = 'stamina > 20';
                else if (tag === '誘惑') condition = 'coin > 30';
                else if (tag === '暗黑') condition = 'mind < 70';
                else condition = 'stamina > 15 && mind > 15';
            }
            options.push({
                text: selectedTexts[i],
                nextEvent: target,
                baseEffect: effect,
                condition: condition,
                togglePreview: togglePreview,
            });
        }
        return options;
    }

    // ---------- 1. 主線 M1~M50 ----------
    for (let i = 1; i <= 50; i++) {
        const id = 'M' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = '';
        if (tag === '恐怖') desc = `👻 ` + randElem(['廢棄醫院的鬼影','半夜手機傳來嬰兒笑聲','鏡子裡的人眨眼','床底下的濕髮','電梯按了13樓卻不停','背後腳步聲','螢幕浮現「快逃」','雨夜看見無臉人']) + '。';
        else if (tag === '搞笑') desc = `🤣 ` + randElem(['踩到香蕉皮滑進垃圾桶','內褲穿反被女神發現','被鴿子屎砸中頭獎','自動販賣機找零吐出一堆乖乖','誤闖阿伯的廣場舞陣型','貓咪瘋狂舔你的腳趾','參加滑稽模仿大賽得名']) + '！';
        else if (tag === '暗黑') desc = `💀 ` + randElem(['同事偷偷把你的履歷丟掉','房東漲租金並貼出凶宅證明','發現女友是詐騙集團','老婦人跌倒反而誣賴你','銀行戶頭被凍結','求職感謝函(嘲笑)','摯友背後捅刀']) + '⋯⋯';
        else if (tag === '誘惑') desc = `💋 ` + randElem(['神秘女子邀你參加私人派對','投資群組「保證獲利」','路邊撿到裝滿現金的錢包','酒店經紀遞上名片','免費試用頂級保健品','賭場中介來搭訕']) + '，';
        else if (tag === '獵奇') desc = `👁️ ` + randElem(['巷子裡賣會說話的烤地瓜','鄰居陽台種滿食人花','7-11店員長出第三隻眼','捷運站閘門唱京劇','你的影子自己跑去買消夜','大樓電梯直通異空間']) + '？！';
        else desc = `📰 ` + randElem(['AI取代了你的工作','元宇宙炒房團跑路','政府發放六千元卻限時24hr','蛋價飆漲改養電子雞','Youtuber挑戰住凶宅','Threads上被炎上','以巴衝突影響油價']) + '。';

        // 根據屬性動態添加描述
        if (state.coin < 20) desc += ' 你摸著空空的錢包，更加焦慮。';
        else if (state.coin > 200) desc += ' 你財大氣粗，走路有風。';
        if (state.stamina < 20) desc += ' 你累得眼皮打架，卻不能停下。';
        if (state.mind < 20) desc += ' 精神恍惚，你開始出現幻覺。';

        // 生成選項 (數量3~4)
        const optCount = randInt(3, 4);
        const options = createOptionsForEvent(tag, optCount, (idx) => {
            if (i === 50 && idx === 0) return 'E' + randInt(1,12);
            const r = Math.random();
            if (r < 0.5) return 'M' + (i+1 > 50 ? 50 : i+1);
            else if (r < 0.8) return 'S' + randInt(1, 45);
            else return 'R' + randInt(1, 35);
        });

        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 2. 分線 S1~S45 ----------
    for (let i = 1; i <= 45; i++) {
        const id = 'S' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = `🔀 分歧線·${i} ：`;
        if (tag === '恐怖') desc += `🕸️ ` + randElem(['廢棄醫院的地下室','鏡中浮現陌生臉孔','電梯裡的女人','床下的呼吸聲']) + ' 你捲入莫名恐懼。';
        else if (tag === '搞笑') desc += `🍌 ` + randElem(['誤入老人卡拉OK大賽','被喜劇演員拉上臺','搞笑藝人傳授祕笈']) + ' 周圍人都在笑。';
        else if (tag === '暗黑') desc += `🩸 ` + randElem(['職場霸凌','親人欠債跑路','被誣陷入獄']) + ' 你感到絕望。';
        else if (tag === '誘惑') desc += `🍷 ` + randElem(['豪門聚會','加密貨幣礦場','直銷大會']) + ' 慾望在招手。';
        else if (tag === '獵奇') desc += `🐙 ` + randElem(['街頭賣藝的怪人','深夜廣播的雜訊','鄰居家傳出呢喃']) + ' 無法理解。';
        else desc += `🌐 ` + randElem(['深偽技術詐騙','虛擬貨幣暴跌','社群媒體炎上']) + ' 這就是現代。';

        const optCount = randInt(2, 4);
        const options = createOptionsForEvent(tag, optCount, (idx) => {
            const r = Math.random();
            if (r < 0.4) return 'M' + randInt(1, 50);
            else if (r < 0.65) return 'S' + randInt(1, 45);
            else if (r < 0.9) return 'R' + randInt(1, 35);
            else return 'E' + randInt(1, 12);
        });

        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 3. 隨機 R1~R35 ----------
    for (let i = 1; i <= 35; i++) {
        const id = 'R' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = `🎲 隨機·${i}：`;
        switch(tag) {
            case '恐怖': desc += `🪦 ` + randElem(['背後腳步聲','鏡子流血','窗外有臉']) + ` 心跳加速。`; break;
            case '搞笑': desc += `😹 ` + randElem('踩到狗屎|被鴿子追|內褲鬆脫'.split('|')) + ` 你忍不住笑了。`; break;
            case '暗黑': desc += `⚰️ ` + randElem('錢包被偷|收到兵單|確診隔離'.split('|')) + ` 社會現實。`; break;
            case '誘惑': desc += `💄 ` + randElem('路邊發免費券|交友軟體配對|直銷邀請') + ` 誘惑當前。`; break;
            case '獵奇': desc += `🧿 ` + randElem('天空下青蛙|電梯裡的神像|會說話的自動販賣機') + ` 超出常理。`; break;
            case '時事': desc += `📢 ` + randElem('總統大選|奧運轉播|最新迷因') + ` 跟上話題。`; break;
        }

        const optCount = randInt(2, 3);
        const options = createOptionsForEvent(tag, optCount, (idx) => {
            const r = Math.random();
            if (r < 0.5) return 'M' + randInt(1, 50);
            else if (r < 0.8) return 'R' + randInt(1, 35);
            else if (r < 0.95) return 'S' + randInt(1, 45);
            else return 'E' + randInt(1, 12);
        });

        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 4. 結局 E1~E12 ----------
    const endingList = [
        { name:'平凡永生', desc:'你度過了毫無波瀾的一生。在搖椅上睡去，再也沒醒來。', coin:0, stamina:0, mind:0 },
        { name:'瘋狂邊緣', desc:'精神歸零⋯你看著虛空低語，被送入療養院。', coin:-30, stamina:-20, mind:-100 },
        { name:'黃金囚徒', desc:'金幣滿滿，但眾叛親離。你抱著錢凍死在天橋下。', coin:200, stamina:-80, mind:-60 },
        { name:'超自然體', desc:'第三隻眼張開，你成了陰陽交界的存在。', coin:20, stamina:10, mind:99 },
        { name:'社會性死亡', desc:'你的荒謬影片瘋傳，從此無法直視熟人。', coin:-20, stamina:30, mind:-70 },
        { name:'暗黑贏家', desc:'踩著別人往上爬，你坐上高位卻永遠失眠。', coin:150, stamina:-40, mind:-30 },
        { name:'誘惑深淵', desc:'沉溺於慾望，最後一無所有。', coin:-100, stamina:10, mind:-90 },
        { name:'時事倖存者', desc:'你跟上了每一波迷因，成為網路廢人但開心。', coin:5, stamina:-20, mind:-10 },
        { name:'獵奇收藏家', desc:'家裡堆滿詭異物品，某天全消失，你反而失落。', coin:-60, stamina:0, mind:20 },
        { name:'平凡英雄', desc:'你救了許多人，低調回到日常。', coin:30, stamina:-30, mind:50 },
        { name:'體力透支', desc:'長時間過勞，你在工作中倒下，再也沒起來。', coin:0, stamina:-100, mind:10 },
        { name:'精神覺醒', desc:'歷經無數詭事，你參透虛幻，選擇歸隱山林。', coin:-50, stamina:40, mind:120 }
    ];
    for (let i = 1; i <= 12; i++) {
        const id = 'E' + i;
        const ed = endingList[i-1];
        const desc = `🏁 結局 · ${ed.name} ：${ed.desc} (金幣變動 ${ed.coin>0?'+':''}${ed.coin}，體力 ${ed.stamina>0?'+':''}${ed.stamina}，精神 ${ed.mind>0?'+':''}${ed.mind})`;
        eventDB.set(id, { id, desc, tag:'結局', options: [] });
    }

    // 補遺：確保所有目標事件存在
    for (let [id, ev] of eventDB.entries()) {
        if (ev.options) {
            ev.options = ev.options.map(opt => {
                if (!eventDB.has(opt.nextEvent)) {
                    opt.nextEvent = 'M' + randInt(1,50);
                }
                return opt;
            });
        }
    }

    // ---------- UI 元素 ----------
    const statCoin = document.getElementById('statCoin');
    const statStamina = document.getElementById('statStamina');
    const statMind = document.getElementById('statMind');
    const previewEye = document.getElementById('previewEye');
    const eventDesc = document.getElementById('eventDesc');
    const eventTag = document.getElementById('eventTag');
    const optionsArea = document.getElementById('optionsArea');
    const resetBtn = document.getElementById('resetGameBtn');

    function updateStatsUI() {
        statCoin.innerText = state.coin;
        statStamina.innerText = state.stamina;
        statMind.innerText = state.mind;
        // 更新預知眼狀態
        if (state.showEffectPreview) {
            previewEye.classList.add('active');
            previewEye.title = '預知狀態：開啟 (可看見選擇的後果)';
        } else {
            previewEye.classList.remove('active');
            previewEye.title = '預知狀態：關閉 (後果隱藏)';
        }
    }

    function checkExtremeEnding() {
        if (state.stamina <= 0) return 'E2';
        if (state.mind <= 0) return 'E2';
        if (state.coin <= -150) return 'E7';
        if (state.coin >= 600) return 'E3';
        if (state.stamina >= 200) return 'E4';
        if (state.mind >= 180) return 'E12';
        return null;
    }

    function applyEffect(baseEffect) {
        const effect = computeEffect(baseEffect);
        if (effect.coin) state.coin = Math.max(-999, Math.min(999, state.coin + effect.coin));
        if (effect.stamina) state.stamina = Math.max(0, Math.min(200, state.stamina + effect.stamina));
        if (effect.mind) state.mind = Math.max(0, Math.min(200, state.mind + effect.mind));
        updateStatsUI();

        const forcedEnd = checkExtremeEnding();
        if (forcedEnd) {
            state.currentEventId = forcedEnd;
        }
    }

    function loadEvent() {
        const ev = eventDB.get(state.currentEventId);
        if (!ev) {
            state.currentEventId = 'M1';
            loadEvent();
            return;
        }

        // 動態描述 (可依屬性再微調)
        let finalDesc = ev.desc;
        eventDesc.innerText = finalDesc;
        eventTag.innerText = `#${ev.id} · ${ev.tag || '未知'}`;

        optionsArea.innerHTML = '';

        // 結局處理
        if (ev.id.startsWith('E')) {
            const msg = document.createElement('div');
            msg.style.padding = '20px';
            msg.style.textAlign = 'center';
            msg.style.color = '#b8a9c9';
            msg.style.fontStyle = 'italic';
            msg.innerText = '⭐ 旅程終點 · 點下方重啟按鈕展開新人生';
            optionsArea.appendChild(msg);
            if (!ev._applied) {
                const idx = parseInt(ev.id.substring(1)) - 1;
                if (endingList[idx]) {
                    applyEffect({
                        coin: endingList[idx].coin,
                        stamina: endingList[idx].stamina,
                        mind: endingList[idx].mind
                    });
                }
                ev._applied = true;
            }
            return;
        }

        // 過濾符合條件的選項
        const availableOptions = ev.options.filter(opt => checkCondition(opt.condition));

        availableOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';

            // 根據 showEffectPreview 決定是否顯示效果文字
            let btnText = opt.text;
            if (state.showEffectPreview) {
                const previewEff = computeEffect(opt.baseEffect);
                const effStr = ` [💰${previewEff.coin>0?'+':''}${previewEff.coin} ⚡${previewEff.stamina>0?'+':''}${previewEff.stamina} 🧠${previewEff.mind>0?'+':''}${previewEff.mind}]`;
                btnText += effStr;
            }
            btn.innerText = btnText;

            btn.addEventListener('click', () => {
                // 先套用效果 (可能改變屬性)
                applyEffect(opt.baseEffect);

                // 處理預知眼切換 (如果選項有 togglePreview)
                if (opt.togglePreview) {
                    state.showEffectPreview = !state.showEffectPreview;
                    updateStatsUI(); // 更新眼睛圖示
                }

                // 切換事件
                if (opt.nextEvent && eventDB.has(opt.nextEvent)) {
                    state.currentEventId = opt.nextEvent;
                } else {
                    state.currentEventId = 'M' + randInt(1,50);
                }
                const forced = checkExtremeEnding();
                if (forced) state.currentEventId = forced;
                loadEvent();
            });
            optionsArea.appendChild(btn);
        });

        // 若無可用選項，提供返回主線
        if (availableOptions.length === 0) {
            const fallbackBtn = document.createElement('button');
            fallbackBtn.className = 'option-btn';
            fallbackBtn.innerText = '🚪 無路可走，回到主線';
            fallbackBtn.addEventListener('click', () => {
                state.currentEventId = 'M' + randInt(1,50);
                loadEvent();
            });
            optionsArea.appendChild(fallbackBtn);
        }
    }

    function resetGame() {
        state = {
            coin: 50,
            stamina: 50,
            mind: 50,
            currentEventId: 'M1',
            showEffectPreview: false,
        };
        for (let ev of eventDB.values()) {
            ev._applied = false;
        }
        updateStatsUI();
        loadEvent();
    }

    // 初始載入
    resetGame();
    resetBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
