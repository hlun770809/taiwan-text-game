<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>墮落青年 · 不重複人生</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0e14;
      font-family: 'Segoe UI', 'Noto Sans TC', Roboto, sans-serif;
      padding: 16px 12px 40px;
      color: #eef2f6;
    }
    #game {
      max-width: 720px;
      margin: 0 auto;
      background: #151b26;
      border-radius: 36px 36px 28px 28px;
      padding: 24px 18px 32px;
      box-shadow: 0 12px 0 #0a0f17;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 1px;
      background: linear-gradient(145deg, #ffb347, #ff8c42);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 20px;
      background: #1d2535;
      border-radius: 48px;
      padding: 16px 22px;
      margin-bottom: 20px;
      border: 1px solid #3d4b65;
      font-size: 1rem;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stat-label {
      color: #a0b2d9;
    }
    .stat-value {
      font-weight: 700;
      background: #00000030;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid #5f739b;
    }
    #story {
      background: #1b2333;
      border-radius: 28px;
      padding: 28px 22px;
      line-height: 1.8;
      font-size: 1.15rem;
      white-space: pre-wrap;
      min-height: 200px;
      border: 1px solid #43506e;
      box-shadow: inset 0 4px 6px #00000040;
      margin-bottom: 24px;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 8px;
    }
    .choice-btn {
      background: #263040;
      border: none;
      border-radius: 60px;
      padding: 18px 22px;
      color: white;
      font-size: 1.12rem;
      text-align: left;
      border-bottom: 4px solid #0f1622;
      transition: 0.1s ease;
      box-shadow: 0 6px 0 #0c121e;
      cursor: pointer;
    }
    .choice-btn:active {
      transform: translateY(5px);
      border-bottom-width: 1px;
    }
    #restart {
      margin-top: 30px;
      width: 100%;
      padding: 18px;
      background: transparent;
      border: 2px solid #5e6e8f;
      color: #ccd9f0;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: bold;
      display: none;
      cursor: pointer;
    }
    .footer {
      text-align: center;
      color: #5c6d8f;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
<div id="game">
  <h1>⬇️ 墮落青年</h1>
  <div class="stats" id="stats">
    <div class="stat-item"><span class="stat-label">💰錢</span><span class="stat-value" id="money">1200</span></div>
    <div class="stat-item"><span class="stat-label">⚡體</span><span class="stat-value" id="energy">75</span></div>
    <div class="stat-item"><span class="stat-label">🧠神</span><span class="stat-value" id="mental">68</span></div>
    <div class="stat-item"><span class="stat-label">👿罪</span><span class="stat-value" id="sin">0</span></div>
    <div class="stat-item"><span class="stat-label">🌑瘋</span><span class="stat-value" id="crazy">0</span></div>
    <div class="stat-item"><span class="stat-label">🏷️名</span><span class="stat-value" id="fame">0</span></div>
  </div>
  <div id="story">載入中...</div>
  <div class="choices" id="choices"></div>
  <button id="restart">🔄 重新墮落</button>
  <div class="footer">每天一個選擇 • 超過160種事件 • 18種結局</div>
</div>
<script>
(function() {
  // --------------------- 初始狀態 -------------------------
  let state = {
    money: 1200,
    energy: 75,
    mental: 68,
    sin: 0,           // 罪惡值 (加入幫派、犯罪)
    crazy: 0,         // 瘋狂值 (靈異、精神異常)
    fame: 0,          // 名聲 (網紅、街頭名人)
    drug: 0,          // 藥物依賴
    debt: 0,          // 負債
    gang: 0,          // 幫派關係
    cult: 0,          // 邪教傾向
    day: 1,
    // 特殊旗標 (用於結局)
    killed: false,
    betrayed: false,
    saved: false,
    enlighten: false,
    // 記錄已觸發的一次性事件 (once)
    triggeredEvents: {}
  };

  // --------------------- 工具函數 -------------------------
  function clamp(num, min, max) {
    return Math.min(max, Math.max(min, num));
  }

  function update(change) {
    if (change.money !== undefined) state.money = clamp(state.money + change.money, 0, 999999);
    if (change.energy !== undefined) state.energy = clamp(state.energy + change.energy, 0, 100);
    if (change.mental !== undefined) state.mental = clamp(state.mental + change.mental, 0, 100);
    if (change.sin !== undefined) state.sin = clamp(state.sin + change.sin, 0, 100);
    if (change.crazy !== undefined) state.crazy = clamp(state.crazy + change.crazy, 0, 100);
    if (change.fame !== undefined) state.fame = clamp(state.fame + change.fame, 0, 100);
    if (change.drug !== undefined) state.drug = clamp(state.drug + change.drug, 0, 100);
    if (change.debt !== undefined) state.debt = clamp(state.debt + change.debt, 0, 999999);
    if (change.gang !== undefined) state.gang = clamp(state.gang + change.gang, 0, 100);
    if (change.cult !== undefined) state.cult = clamp(state.cult + change.cult, 0, 100);
    if (change.killed) state.killed = true;
    if (change.betrayed) state.betrayed = true;
    if (change.saved) state.saved = true;
    if (change.enlighten) state.enlighten = true;
  }

  // 更新畫面數值
  function refreshStats() {
    document.getElementById('money').innerText = state.money;
    document.getElementById('energy').innerText = state.energy;
    document.getElementById('mental').innerText = state.mental;
    document.getElementById('sin').innerText = state.sin;
    document.getElementById('crazy').innerText = state.crazy;
    document.getElementById('fame').innerText = state.fame;
  }

  // --------------------- 結局列表 (18種) --------------------
  const endings = [
    { id: 'end_debt', name: '💸 債台高築跳樓', condition: () => state.debt >= 80000 && state.mental < 20,
      text: '你欠下巨額債務，走投無路，從頂樓一躍而下。留下滿地借據。' },
    { id: 'end_drug', name: '💉 毒蟲人生', condition: () => state.drug >= 80,
      text: '你徹底被毒品控制，在廢棄大樓裡注射過量，再也醒不過來。' },
    { id: 'end_gang', name: '🔫 幫派火拚', condition: () => state.gang >= 70 && state.sin >= 50,
      text: '你成為幫派核心，但在一次爭地盤中被亂刀砍死。' },
    { id: 'end_cult', name: '🕯️ 邪教獻祭', condition: () => state.cult >= 70,
      text: '你深信教主能帶你解脫，自願成為祭品，永遠留在山洞裡。' },
    { id: 'end_crazy', name: '👁️ 精神分裂', condition: () => state.crazy >= 90,
      text: '你看見的世界與常人完全不同，被送進療養院，終身禁錮。' },
    { id: 'end_hero', name: '🦸 平凡英雄', condition: () => state.saved && state.sin < 20 && state.mental > 60,
      text: '你曾在災難中救出一家三口，雖然依舊貧窮，但心裡踏實。' },
    { id: 'end_betray', name: '🗡️ 被出賣', condition: () => state.betrayed && state.gang > 30,
      text: '你最信任的兄弟出賣了你，你死在巷子裡，無人知曉。' },
    { id: 'end_enlighten', name: '🧘 覺悟行者', condition: () => state.enlighten && state.crazy > 50,
      text: '你拋棄物質，成為街頭哲學家，偶爾有人給你食物，你已不在乎。' },
    { id: 'end_rich', name: '💰 暴富短暫', condition: () => state.money >= 100000 && state.sin < 30,
      text: '你意外獲得一大筆錢，但揮霍無度，一年後比現在更窮。' },
    { id: 'end_normal', name: '🏠 普通上班族', condition: () => state.day >= 100 && state.money > 20000 && state.mental > 50,
      text: '你找到一份穩定工作，搬離了那個鬼地方，過著朝九晚五的日子。' },
    { id: 'end_killer', name: '🔪 殺人犯', condition: () => state.killed,
      text: '你在衝突中失手殺人，開始逃亡，最終被捕入獄。' },
    { id: 'end_starve', name: '🍂 餓死街頭', condition: () => state.money <= 0 && state.energy <= 0,
      text: '你再也走不動，倒在公園長椅下，結束了短暫的一生。' },
    { id: 'end_suicide', name: '🌊 精神崩潰自殺', condition: () => state.mental <= 0,
      text: '你受不了這個世界的折磨，選擇結束自己。' },
    { id: 'end_workaholic', name: '⚡ 過勞死', condition: () => state.energy <= 0 && state.money > 10000,
      text: '你為了還債沒日沒夜工作，最後心臟病發作。' },
    { id: 'end_hermit', name: '🏔️ 隱居山林', condition: () => state.day >= 80 && state.money < 5000 && state.mental > 70,
      text: '你厭倦城市，躲到深山自給自足，再也沒人找到你。' },
    { id: 'end_cynical', name: '📱 網路酸民', condition: () => state.fame >= 60 && state.sin < 10,
      text: '你成為知名網紅，靠帶風向賺錢，但內心空洞。' },
    { id: 'end_gangster', name: '👑 地方角頭', condition: () => state.gang >= 80 && state.money > 50000,
      text: '你爬到了幫派高層，但每天都要提防暗殺。' },
    { id: 'end_zombie', name: '🧟 行屍走肉', condition: () => state.drug >= 50 && state.mental <= 20,
      text: '你對一切都無所謂，每天只是找錢買藥，如同活死人。' },
  ];

  function checkEnding() {
    for (let e of endings) {
      if (e.condition()) {
        return e;
      }
    }
    return null;
  }

  // --------------------- 事件庫 (160+) ---------------------
  // 每個事件包含 id, 類別, 文字, 選項, once(是否只觸發一次)
  // once 事件觸發後會加入 triggeredEvents 不再抽取
  const events = [
    // ========== 日常類 (30+) ==========
    { id: 'daily_1', category: 'daily', once: false,
      text: '你醒來發現手機沒電，充電器壞了。',
      choices: [
        { text: '買新的 (金錢-500)', effect: { money: -500 } },
        { text: '去超商借充電 (體力-5)', effect: { energy: -5 } },
        { text: '不管它，放空一天 (精神+5)', effect: { mental: 5 } }
      ] },
    { id: 'daily_2', category: 'daily', once: false,
      text: '樓下早餐店阿姨多送你一顆蛋。',
      choices: [
        { text: '開心接受 (精神+3, 體力+3)', effect: { mental: 3, energy: 3 } },
        { text: '堅持付錢 (金錢-15)', effect: { money: -15 } },
        { text: '趁機訴苦 (精神-2, 阿姨尷尬)', effect: { mental: -2 } }
      ] },
    { id: 'daily_3', category: 'daily', once: false,
      text: '隔壁情侶大吵一架，摔東西。',
      choices: [
        { text: '報警', effect: { mental: -3 } },
        { text: '敲牆警告', effect: { gang: 2 } },
        { text: '錄影上網 (名聲+5, 罪惡+2)', effect: { fame: 5, sin: 2 } }
      ] },
    { id: 'daily_4', category: 'daily', once: false,
      text: '你發現銀行帳戶被扣了不明的手續費。',
      choices: [
        { text: '打電話去罵 (精神+2)', effect: { mental: 2 } },
        { text: '自認倒楣', effect: { money: -300 } },
        { text: '提領所有錢放床底', effect: { crazy: 3 } }
      ] },
    { id: 'daily_5', category: 'daily', once: false,
      text: '颱風天，窗戶滲水。',
      choices: [
        { text: '用抹布堵住 (體力-5)', effect: { energy: -5 } },
        { text: '找房東 (精神+2)', effect: { mental: 2 } },
        { text: '拿桶子接水，順便洗澡', effect: { crazy: 3, money: 100 } }
      ] },
    { id: 'daily_6', category: 'daily', once: false,
      text: '你撿到一隻流浪狗。',
      choices: [
        { text: '帶回家養 (金錢-200/月)', effect: { money: -200, mental: 8 } },
        { text: '送去收容所', effect: { mental: 3 } },
        { text: '無視', effect: { sin: 2 } }
      ] },
    { id: 'daily_7', category: 'daily', once: false,
      text: '收到紅色炸彈，朋友要結婚。',
      choices: [
        { text: '包 2000 去', effect: { money: -2000, mental: 5 } },
        { text: '裝沒看見', effect: { fame: -5 } },
        { text: '藉口出差', effect: { sin: 3 } }
      ] },
    { id: 'daily_8', category: 'daily', once: false,
      text: '你剪壞了頭髮，變得很醜。',
      choices: [
        { text: '戴帽子', effect: { mental: -3 } },
        { text: '去理髮店補救 (金錢-400)', effect: { money: -400, mental: 5 } },
        { text: '光頭也很帥', effect: { crazy: 4 } }
      ] },
    { id: 'daily_9', category: 'daily', once: false,
      text: '郵差送錯信，是別人的信用卡。',
      choices: [
        { text: '還給郵差', effect: { mental: 3 } },
        { text: '試試看能不能刷', effect: { sin: 10, money: 5000, debt: 5000 } },
        { text: '剪掉丟掉', effect: {} }
      ] },
    { id: 'daily_10', category: 'daily', once: false,
      text: '你夢到過世的奶奶給你一個紅包。',
      choices: [
        { text: '去墳前看看', effect: { mental: 10, crazy: 2 } },
        { text: '當作沒這回事', effect: { mental: -3 } },
        { text: '買紙錢燒', effect: { money: -300, mental: 8 } }
      ] },
    { id: 'daily_11', category: 'daily', once: false,
      text: '隔壁搬來新鄰居，一直瞪著你。',
      choices: [
        { text: '打招呼', effect: { mental: 2 } },
        { text: '瞪回去', effect: { gang: 2 } },
        { text: '貼符咒在門口', effect: { crazy: 5 } }
      ] },
    { id: 'daily_12', category: 'daily', once: false,
      text: '你發現自己有白頭髮了。',
      choices: [
        { text: '染髮 (金錢-600)', effect: { money: -600 } },
        { text: '拔掉', effect: { mental: -2 } },
        { text: '接受老化', effect: { crazy: 2 } }
      ] },
    { id: 'daily_13', category: 'daily', once: false,
      text: '去超商買東西，店員多找你 500 元。',
      choices: [
        { text: '還回去', effect: { mental: 8 } },
        { text: '默默收下', effect: { money: 500, sin: 3 } },
        { text: '拿來買樂透', effect: { money: -500, crazy: 2 } }
      ] },
    { id: 'daily_14', category: 'daily', once: false,
      text: '你便秘三天了。',
      choices: [
        { text: '買軟便劑 (金錢-150)', effect: { money: -150, energy: 5 } },
        { text: '狂吃香蕉', effect: { money: -80 } },
        { text: '用力', effect: { mental: -5 } }
      ] },
    { id: 'daily_15', category: 'daily', once: false,
      text: '你覺得有人在跟蹤你。',
      choices: [
        { text: '突然回頭', effect: { mental: -3 } },
        { text: '跑進超商', effect: { energy: -5 } },
        { text: '拿手機反拍', effect: { crazy: 3, fame: 3 } }
      ] },
    { id: 'daily_16', category: 'daily', once: false,
      text: '你租屋處的熱水器壞了。',
      choices: [
        { text: '洗冷水澡 (體力-5)', effect: { energy: -5 } },
        { text: '請房東修', effect: { mental: 2 } },
        { text: '去朋友家洗', effect: { fame: -3 } }
      ] },
    { id: 'daily_17', category: 'daily', once: false,
      text: '在路上遇到發傳單的工讀生。',
      choices: [
        { text: '拿傳單', effect: {} },
        { text: '問他時薪多少', effect: { money: 150, energy: -5 } },
        { text: '發起傳單改革', effect: { fame: 4 } }
      ] },
    { id: 'daily_18', category: 'daily', once: false,
      text: '你發現自己忘了某個重要約會。',
      choices: [
        { text: '打電話道歉', effect: { mental: -5 } },
        { text: '假裝沒發生', effect: { sin: 2 } },
        { text: '衝去現場', effect: { energy: -10, mental: -3 } }
      ] },
    { id: 'daily_19', category: 'daily', once: false,
      text: '你參加里民活動，抽中一台烤箱。',
      choices: [
        { text: '開心搬回家', effect: { mental: 5 } },
        { text: '上網賣掉', effect: { money: 1500 } },
        { text: '送給鄰居', effect: { fame: 5 } }
      ] },
    { id: 'daily_20', category: 'daily', once: false,
      text: '你半夜被蚊子吵醒。',
      choices: [
        { text: '起來打蚊子', effect: { energy: -2 } },
        { text: '戴耳塞繼續睡', effect: { mental: 2 } },
        { text: '拿電蚊拍跳舞', effect: { crazy: 3 } }
      ] },

    // ========== 工作類 (25+) ==========
    { id: 'work_1', category: 'work', once: false,
      text: '臨時粗工，搬運貨物一天 1500。',
      choices: [
        { text: '接下 (體力-20, 金錢+1500)', effect: { energy: -20, money: 1500 } },
        { text: '太累了拒絕', effect: { money: -200 } },
        { text: '找朋友一起做', effect: { fame: 3, money: 1200, energy: -15 } }
      ] },
    { id: 'work_2', category: 'work', once: false,
      text: '超商大夜班，時薪 200。',
      choices: [
        { text: '去做 (精神-8, 金錢+800)', effect: { mental: -8, money: 800 } },
        { text: '只做幾天', effect: { money: 300, energy: -5 } },
        { text: '偷吃報廢品', effect: { sin: 3, money: 300 } }
      ] },
    { id: 'work_3', category: 'work', once: false,
      text: '接到詐騙集團的打工邀約，說輕鬆月入十萬。',
      choices: [
        { text: '加入 (罪惡+20, 金錢+20000)', effect: { sin: 20, money: 20000, gang: 10 } },
        { text: '拒絕並報警', effect: { fame: 10 } },
        { text: '假裝配合再騙他們', effect: { crazy: 8, sin: 5, money: 5000 } }
      ] },
    { id: 'work_4', category: 'work', once: false,
      text: '公司裁員，你被通知走人。',
      choices: [
        { text: '申請補助', effect: { money: 2000, mental: -10 } },
        { text: '立刻找新工作', effect: { energy: -10 } },
        { text: '自己創業', effect: { money: -5000, debt: 5000, crazy: 10 } }
      ] },
    { id: 'work_5', category: 'work', once: false,
      text: '外送員，接單跑腿。',
      choices: [
        { text: '跑十單 (體力-15, 金錢+800)', effect: { energy: -15, money: 800 } },
        { text: '偷懶只跑五單', effect: { money: 400, energy: -7 } },
        { text: '車禍 (體力-30, 金錢-2000)', effect: { energy: -30, money: -2000, crazy: 5 } }
      ] },
    { id: 'work_6', category: 'work', once: false,
      text: '清潔隊員，負責收垃圾。',
      choices: [
        { text: '做一個月 (體力-40, 金錢+3000)', effect: { energy: -40, money: 3000 } },
        { text: '檢寶特瓶變賣', effect: { money: 200, energy: -5 } },
        { text: '撿到名牌包', effect: { money: 5000, sin: 5 } }
      ] },
    { id: 'work_7', category: 'work', once: false,
      text: '幫派分子找你當運毒小弟。',
      choices: [
        { text: '答應 (罪惡+30, 金錢+10000, 幫派+20)', effect: { sin: 30, money: 10000, gang: 20, drug: 10 } },
        { text: '拒絕並搬家', effect: { money: -2000 } },
        { text: '偷偷報警', effect: { gang: -10, sin: -5, fame: 15 } }
      ] },

    { id: 'dark_9', category: 'dark', once: true,
      text: '廟公找你當乩童，說有信徒會捐錢。',
      choices: [
        { text: '答應 (罪惡+10, 金錢+5000, 邪教+10)', effect: { sin: 10, money: 5000, cult: 10, crazy: 5 } },
        { text: '拒絕', effect: {} },
        { text: '假裝起乩', effect: { crazy: 15, money: 2000, cult: 5 } }
      ] },
    { id: 'dark_10', category: 'dark', once: true,
      text: '你發現路邊有一個錢包，裡面有兩萬。',
      choices: [
        { text: '據為己有', effect: { money: 20000, sin: 15 } },
        { text: '送去派出所', effect: { fame: 10, mental: 10 } },
        { text: '拿一半', effect: { money: 10000, sin: 8 } }
      ] },
    { id: 'dark_11', category: 'dark', once: true,
      text: '有陌生人請你幫忙搬東西，結果是贓物。',
      choices: [
        { text: '幫忙 (罪惡+10, 金錢+2000)', effect: { sin: 10, money: 2000, gang: 5 } },
        { text: '拒絕', effect: {} },
        { text: '反過來報警', effect: { fame: 15, gang: -5 } }
      ] },
    { id: 'dark_12', category: 'dark', once: true,
      text: '你被黑道盯上，要你每個月繳保護費。',
      choices: [
        { text: '乖乖繳 (金錢-3000/月)', effect: { money: -3000, sin: 5 } },
        { text: '找人幫忙', effect: { gang: 10, money: -5000 } },
        { text: '反抗', effect: { energy: -30, gang: 10, killed: true } }
      ] },
    { id: 'dark_13', category: 'dark', once: true,
      text: '你缺錢，想搶超商。',
      choices: [
        { text: '真的去搶', effect: { money: 5000, sin: 30, gang: 10, killed: true } },
        { text: '打消念頭', effect: { mental: 5 } },
        { text: '搶劫前被抓', effect: { sin: 5, debt: 10000 } }
      ] },
    { id: 'dark_14', category: 'dark', once: true,
      text: '有富婆想包養你。',
      choices: [
        { text: '接受 (金錢+50000, 罪惡+5, 名聲-5)', effect: { money: 50000, sin: 5, fame: -5, energy: -30 } },
        { text: '拒絕', effect: { mental: 5 } },
        { text: '介紹朋友', effect: { money: 5000 } }
      ] },
    { id: 'dark_15', category: 'dark', once: true,
      text: '你加入一個激進社運團體，開始抗爭。',
      choices: [
        { text: '積極參與', effect: { fame: 20, sin: 5, gang: 5, energy: -20 } },
        { text: '只旁觀', effect: { fame: 5 } },
        { text: '當臥底', effect: { fame: 15, gang: -5, sin: -5 } }
      ] }
  ];

  // 建立 id 對照表
  const eventMap = {};
  events.forEach(e => eventMap[e.id] = e);

  // 篩選出可用的隨機事件 (排除 once 且已觸發的)
  function getAvailableEvents() {
    return events.filter(e => !(e.once && state.triggeredEvents[e.id]));
  }

  // 抽取隨機事件 (可依類別比例，這裡簡單隨機)
  function getRandomEvent() {
    const available = getAvailableEvents();
    if (available.length === 0) {
      // 如果沒有事件了，複製一個日常事件 (但基本上不會)
      return events.find(e => e.id === 'daily_1');
    }
    const idx = Math.floor(Math.random() * available.length);
    return available[idx];
  }

  // 標記事件為已觸發 (once)
  function markTriggered(eventId) {
    state.triggeredEvents[eventId] = true;
  }

  // 遊戲主迴圈
  let currentEvent = null;
  let gameOver = false;

  function render() {
    if (gameOver) return;

    // 更新數值顯示
    refreshStats();

    // 檢查結局
    const ending = checkEnding();
    if (ending) {
      gameOver = true;
      document.getElementById('story').innerText = `【${ending.name}】\n\n${ending.text}`;
      document.getElementById('choices').innerHTML = '';
      document.getElementById('restart').style.display = 'inline-block';
      return;
    }

    // 若無目前事件，抽一個新事件
    if (!currentEvent) {
      currentEvent = getRandomEvent();
      // 如果是 once 事件，立刻標記 (但還未選，等選完才真正觸發)
    }

    const ev = currentEvent;
    let storyText = `📆 第 ${state.day} 天\n\n${ev.text}`;
    document.getElementById('story').innerText = storyText;

    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';

    ev.choices.forEach((choice, idx) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = choice.text;
      btn.onclick = () => {
        // 套用效果
        if (choice.effect) update(choice.effect);

        // 如果有 nextEvent，則跳到指定事件 (此事件不會被標記觸發，因為是指定事件)
        if (choice.nextEvent) {
          const next = eventMap[choice.nextEvent];
          if (next) {
            currentEvent = next;
            // 若 nextEvent 也是 once，則在這裡標記 (但不會再次隨機出現)
            if (next.once) markTriggered(next.id);
          } else {
            currentEvent = getRandomEvent();
          }
        } else {
          // 正常情況，目前事件如果是 once，標記為已觸發
          if (ev.once) markTriggered(ev.id);
          // 抽取新事件
          currentEvent = getRandomEvent();
        }

        // 天數增加
        state.day += 1;
        render();
      };
      choicesDiv.appendChild(btn);
    });

    document.getElementById('restart').style.display = 'none';
  }

  // 重新開始
  function restart() {
    state = {
      money: 1200,
      energy: 75,
      mental: 68,
      sin: 0,
      crazy: 0,
      fame: 0,
      drug: 0,
      debt: 0,
      gang: 0,
      cult: 0,
      day: 1,
      killed: false,
      betrayed: false,
      saved: false,
      enlighten: false,
      triggeredEvents: {}
    };
    currentEvent = null;
    gameOver = false;
    render();
  }

  document.getElementById('restart').onclick = restart;

  // 啟動
  render();
})();
</script>
</body>
</html>
