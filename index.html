<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>平凡青年異聞錄 · 動態屬性版</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft JhengHei', 'Helvetica Neue', sans-serif;
        }
        body {
            background: #1a1e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 12px;
        }
        .game-container {
            max-width: 720px;
            width: 100%;
            background: #0f1219;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 24px 20px;
            border: 1px solid #2e3a4a;
        }
        .stats-panel {
            background: #1e2636;
            border-radius: 48px;
            padding: 20px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 12px 8px;
            border: 1px solid #3c4b5e;
            margin-bottom: 24px;
            box-shadow: inset 0 2px 5px #0a0c12;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a3442;
            padding: 8px 18px;
            border-radius: 40px;
            border-left: 4px solid;
            font-weight: bold;
            font-size: 1.1rem;
            color: #f0e9d8;
            box-shadow: 0 4px 0 #0b0e13;
        }
        .stat-coin { border-left-color: #f5b342; }
        .stat-stamina { border-left-color: #4ac7a2; }
        .stat-mind { border-left-color: #9f7aea; }
        .stat-value {
            min-width: 48px;
            text-align: center;
            background: #1d2532;
            padding: 4px 10px;
            border-radius: 30px;
            color: white;
        }
        .event-window {
            background: #1b2330;
            border-radius: 48px;
            padding: 30px 24px;
            border: 1px solid #37465b;
            box-shadow: inset 0 0 15px #0a0e14, 0 10px 10px rgba(0,0,0,0.3);
            margin-bottom: 24px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
        }
        .event-desc {
            color: #e6dacf;
            font-size: 1.2rem;
            line-height: 1.6;
            letter-spacing: 0.3px;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 20px;
            text-shadow: 0 2px 3px black;
        }
        .event-tag {
            align-self: flex-end;
            background: #2d3f4f;
            padding: 5px 16px;
            border-radius: 50px;
            color: #bdd9f0;
            font-size: 0.8rem;
            border: 1px solid #5f7a97;
        }
        .options-area {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
        }
        .option-btn {
            background: #283244;
            border: none;
            border-radius: 60px;
            padding: 18px 22px;
            font-size: 1.1rem;
            text-align: left;
            color: #f2e5d4;
            border-left: 8px solid #6c5b7b;
            box-shadow: 0 6px 0 #121722, 0 8px 12px black;
            transition: 0.07s ease;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
        }
        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #121722, 0 5px 10px black;
        }
        .option-btn.disabled, .option-btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .reset-btn {
            background: #393e5c;
            border: none;
            border-radius: 50px;
            padding: 16px 26px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f0e9db;
            box-shadow: 0 5px 0 #1d2232;
            cursor: pointer;
            transition: 0.07s ease;
            width: fit-content;
            margin: 10px auto 0;
            border: 1px solid #7f8aa8;
            letter-spacing: 1px;
        }
        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1d2232;
        }
        .footer-note {
            color: #5f6f82;
            text-align: center;
            margin-top: 16px;
            font-size: 0.9rem;
            border-top: 1px dashed #2f3e52;
            padding-top: 16px;
        }
        @media (max-width: 450px) {
            .stat-item { font-size: 0.9rem; padding: 6px 12px; }
            .event-desc { font-size: 1rem; }
            .option-btn { padding: 15px 18px; font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="stats-panel" id="statsPanel">
        <div class="stat-item stat-coin">💰金幣 <span class="stat-value" id="statCoin">50</span></div>
        <div class="stat-item stat-stamina">⚡體力 <span class="stat-value" id="statStamina">50</span></div>
        <div class="stat-item stat-mind">🧠精神 <span class="stat-value" id="statMind">50</span></div>
    </div>
    <div class="event-window" id="eventWindow">
        <div class="event-desc" id="eventDesc">載入故事中⋯⋯</div>
        <div class="event-tag" id="eventTag">✨ 平凡啟程</div>
    </div>
    <div class="options-area" id="optionsArea"></div>
    <button class="reset-btn" id="resetGameBtn">🔄 重新開始 · 異聞錄</button>
    <div class="footer-note">🔥 屬性影響選擇 · 超過200種事件 · 10+結局</div>
</div>

<script>
(function(){
    // ---------- 遊戲狀態 ----------
    let state = {
        coin: 50,
        stamina: 50,
        mind: 50,
        currentEventId: 'M1'      // 起始主線
    };

    // ---------- 事件資料庫 ----------
    const eventDB = new Map();

    // ------------------- 輔助函式 -------------------
    const randElem = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

    // 條件檢查函數 (支援簡單表達式)
    function checkCondition(conditionStr) {
        if (!conditionStr) return true;
        try {
            // 將條件字串中的屬性替換為實際值
            const func = new Function('coin', 'stamina', 'mind', `return ${conditionStr};`);
            return func(state.coin, state.stamina, state.mind);
        } catch (e) {
            console.warn('條件解析錯誤', conditionStr, e);
            return true; // 預設顯示
        }
    }

    // 動態效果：可根據屬性調整數值 (例如 coin > 100 時效果加倍)
    function computeEffect(effectTemplate) {
        if (!effectTemplate) return { coin:0, stamina:0, mind:0 };
        // 複製一份
        let eff = { ...effectTemplate };
        // 範例：若金幣很多，花費更傷；精神低時效果加重等
        if (eff.coin && typeof eff.coin === 'number') {
            if (state.coin > 200 && eff.coin < 0) eff.coin = Math.floor(eff.coin * 1.5); // 越有錢損失越多
            if (state.mind < 20 && eff.mind < 0) eff.mind = Math.floor(eff.mind * 1.3);  // 精神脆弱時更傷神
        }
        return eff;
    }

    // ------------------- 豐富詞庫 -------------------
    const scenes = {
        horror: ['廢棄醫院的鬼影', '半夜手機傳來嬰兒笑聲', '鏡子裡的人眨眼', '床底下的濕髮', '電梯按了13樓卻不停', '背後腳步聲', '螢幕浮現「快逃」', '雨夜看見無臉人'],
        funny: ['踩到香蕉皮滑進垃圾桶', '內褲穿反被女神發現', '被鴿子屎砸中頭獎', '自動販賣機找零吐出一堆乖乖', '誤闖阿伯的廣場舞陣型', '貓咪瘋狂舔你的腳趾', '參加滑稽模仿大賽得名'],
        dark: ['同事偷偷把你的履歷丟掉', '房東漲租金並貼出凶宅證明', '發現女友是詐騙集團', '老婦人跌倒反而誣賴你', '銀行戶頭被凍結', '求職感謝函(嘲笑)', '摯友背後捅刀'],
        temptation: ['神秘女子邀你參加私人派對', '投資群組「保證獲利」', '路邊撿到裝滿現金的錢包', '酒店經紀遞上名片', '免費試用頂級保健品', '賭場中介來搭訕'],
        weird: ['巷子裡賣會說話的烤地瓜', '鄰居陽台種滿食人花', '7-11店員長出第三隻眼', '捷運站閘門唱京劇', '你的影子自己跑去買消夜', '大樓電梯直通異空間'],
        current: ['AI取代了你的工作', '元宇宙炒房團跑路', '政府發放六千元卻限時24hr', '蛋價飆漲改養電子雞', 'Youtuber挑戰住凶宅', 'Threads上被炎上', '以巴衝突影響油價']
    };

    // 效果模板 (部分會動態調整)
    const effectTemplates = [
        { coin: 5, stamina: -2, mind: 1 },
        { coin: -8, stamina: 3, mind: -3 },
        { coin: 15, stamina: -5, mind: -5 },
        { coin: -3, stamina: -1, mind: 8 },
        { coin: 20, stamina: -10, mind: -2 },
        { coin: -12, stamina: 6, mind: 6 },
        { coin: 0, stamina: -6, mind: -6 },
        { coin: 7, stamina: 0, mind: -4 },
        { coin: -5, stamina: 4, mind: 2 },
        { coin: 10, stamina: -3, mind: -7 }
    ];

    // 生成選項 (可包含條件)
    function createOption(textSeed, targetId, effect = null, condition = null) {
        const baseEff = effect || randElem(effectTemplates);
        return {
            text: textSeed,
            nextEvent: targetId,
            baseEffect: { ...baseEff },
            condition: condition,  // 字串，例如 "coin > 30 && stamina > 20"
            // 計算實際效果的方法將在點擊時使用 computeEffect(baseEffect)
        };
    }

    // ---------- 1. 生成主線事件 M1~M50 (動態條件) ----------
    for (let i = 1; i <= 50; i++) {
        const id = 'M' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = '';
        if (tag === '恐怖') desc = `👻 ` + randElem(scenes.horror) + '。';
        else if (tag === '搞笑') desc = `🤣 ` + randElem(scenes.funny) + '！';
        else if (tag === '暗黑') desc = `💀 ` + randElem(scenes.dark) + '⋯⋯';
        else if (tag === '誘惑') desc = `💋 ` + randElem(scenes.temptation) + '，';
        else if (tag === '獵奇') desc = `👁️ ` + randElem(scenes.weird) + '？！';
        else desc = `📰 ` + randElem(scenes.current) + '。';

        // 根據屬性動態調整描述 (增加沉浸)
        if (state && state.coin < 20) desc += ' 你摸著空空的錢包，更加焦慮。';
        else if (state && state.stamina < 20) desc += ' 你累得眼皮打架，卻不能停下。';

        // 產生2~4個選項，部分帶條件
        let options = [];
        const optCount = randInt(3, 4); // 增加選項多樣性
        for (let j = 0; j < optCount; j++) {
            let optText = '';
            let condition = null;
            if (j === 0) optText = '🔹 穩健前進 (維持主線)';
            else if (j === 1) optText = '🔸 鋌而走險 (可能分支)';
            else if (j === 2) optText = '⚠️ 異想天開 (獵奇分支)';
            else optText = '🌀 神秘捷徑 (屬性限制)';

            // 加入條件 (例如第三個選項需要體力>30)
            if (j === 2) condition = 'stamina > 30';
            if (j === 3) condition = 'mind > 40 && coin < 100';

            // 決定目標
            let target;
            if (i === 50 && j === 0) target = 'E' + randInt(1,5);
            else {
                const r = Math.random();
                if (r < 0.5) target = 'M' + (i+1 > 50 ? 50 : i+1);
                else if (r < 0.8) target = 'S' + randInt(1, 40);
                else target = 'R' + randInt(1, 35); // 增加隨機事件上限
            }
            options.push(createOption(optText, target, null, condition));
        }
        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 2. 生成分線事件 S1~S45 (增加至45) ----------
    for (let i = 1; i <= 45; i++) {
        const id = 'S' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = `🔀 分歧線·${i} ：`;
        if (tag === '恐怖') desc += `🕸️ ` + randElem(scenes.horror) + ' 你捲入莫名恐懼。';
        else if (tag === '搞笑') desc += `🍌 ` + randElem(scenes.funny) + ' 周圍人都在笑。';
        else if (tag === '暗黑') desc += `🩸 ` + randElem(scenes.dark) + ' 你感到絕望。';
        else if (tag === '誘惑') desc += `🍷 ` + randElem(scenes.temptation) + ' 慾望在招手。';
        else if (tag === '獵奇') desc += `🐙 ` + randElem(scenes.weird) + ' 無法理解。';
        else desc += `🌐 ` + randElem(scenes.current) + ' 這就是現代。';

        // 動態附加
        if (state && state.mind > 80) desc += ' 你的精神敏銳，察覺到異樣。';
        else if (state && state.stamina < 15) desc += ' 你氣喘吁吁，難以應付。';

        let options = [];
        const optCount = randInt(2, 4);
        for (let j = 0; j < optCount; j++) {
            let optText = j===0 ? '🔻 順從本能' : (j===1 ? '🔺 抗拒逃離' : (j===2 ? '⚡ 孤注一擲' : '🌀 靜觀其變'));
            let condition = null;
            if (j === 2) condition = 'stamina > 25 && mind > 25';
            if (j === 3) condition = 'coin > 50';

            const r = Math.random();
            let target;
            if (r < 0.4) target = 'M' + randInt(1, 50);
            else if (r < 0.65) target = 'S' + randInt(1, 45);
            else if (r < 0.9) target = 'R' + randInt(1, 35);
            else target = 'E' + randInt(1, 10);
            options.push(createOption(optText, target, null, condition));
        }
        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 3. 隨機事件 R1~R35 (增加至35) ----------
    for (let i = 1; i <= 35; i++) {
        const id = 'R' + i;
        const tag = randElem(['恐怖','搞笑','暗黑','誘惑','獵奇','時事']);
        let desc = `🎲 隨機·${i}：`;
        switch(tag) {
            case '恐怖': desc += `🪦 ` + randElem(scenes.horror)+ ` 心跳加速。`; break;
            case '搞笑': desc += `😹 ` + randElem(scenes.funny)+ ` 你忍不住笑了。`; break;
            case '暗黑': desc += `⚰️ ` + randElem(scenes.dark)+ ` 社會現實。`; break;
            case '誘惑': desc += `💄 ` + randElem(scenes.temptation)+ ` 誘惑當前。`; break;
            case '獵奇': desc += `🧿 ` + randElem(scenes.weird)+ ` 超出常理。`; break;
            case '時事': desc += `📢 ` + randElem(scenes.current)+ ` 跟上話題。`; break;
        }

        let options = [];
        const optCount = randInt(2, 3);
        for (let j = 0; j < optCount; j++) {
            let optText = j===0 ? '🎭 接受現實' : (j===1 ? '🕳️ 頑強抵抗' : '🌟 順其自然');
            let condition = null;
            if (j === 1) condition = 'stamina > 20';
            if (j === 2) condition = 'mind < 60';

            const r = Math.random();
            let target;
            if (r < 0.5) target = 'M' + randInt(1, 50);
            else if (r < 0.8) target = 'R' + randInt(1, 35);
            else if (r < 0.95) target = 'S' + randInt(1, 45);
            else target = 'E' + randInt(1,10);
            options.push(createOption(optText, target, null, condition));
        }
        eventDB.set(id, { id, desc, tag, options });
    }

    // ---------- 4. 結局事件 E1~E12 (增加至12) ----------
    const endingList = [
        { name:'平凡永生', desc:'你度過了毫無波瀾的一生。在搖椅上睡去，再也沒醒來。', coin:0, stamina:0, mind:0 },
        { name:'瘋狂邊緣', desc:'精神歸零⋯你看著虛空低語，被送入療養院。', coin:-30, stamina:-20, mind:-100 },
        { name:'黃金囚徒', desc:'金幣滿滿，但眾叛親離。你抱著錢凍死在天橋下。', coin:200, stamina:-80, mind:-60 },
        { name:'超自然體', desc:'第三隻眼張開，你成了陰陽交界的存在。', coin:20, stamina:10, mind:99 },
        { name:'社會性死亡', desc:'你的荒謬影片瘋傳，從此無法直視熟人。', coin:-20, stamina:30, mind:-70 },
        { name:'暗黑贏家', desc:'踩著別人往上爬，你坐上高位卻永遠失眠。', coin:150, stamina:-40, mind:-30 },
        { name:'誘惑深淵', desc:'沉溺於慾望，最後一無所有。', coin:-100, stamina:10, mind:-90 },
        { name:'時事倖存者', desc:'你跟上了每一波迷因，成為網路廢人但開心。', coin:5, stamina:-20, mind:-10 },
        { name:'獵奇收藏家', desc:'家裡堆滿詭異物品，某天全消失，你反而失落。', coin:-60, stamina:0, mind:20 },
        { name:'平凡英雄', desc:'你救了許多人，低調回到日常。', coin:30, stamina:-30, mind:50 },
        { name:'體力透支', desc:'長時間過勞，你在工作中倒下，再也沒起來。', coin:0, stamina:-100, mind:10 },
        { name:'精神覺醒', desc:'歷經無數詭事，你參透虛幻，選擇歸隱山林。', coin:-50, stamina:40, mind:120 }
    ];
    for (let i = 1; i <= 12; i++) {
        const id = 'E' + i;
        const ed = endingList[i-1];
        const desc = `🏁 結局 · ${ed.name} ：${ed.desc} (金幣變動 ${ed.coin>0?'+':''}${ed.coin}，體力 ${ed.stamina>0?'+':''}${ed.stamina}，精神 ${ed.mind>0?'+':''}${ed.mind})`;
        eventDB.set(id, { id, desc, tag:'結局', options: [] });
    }

    // 補遺：確保所有目標事件存在
    for (let [id, ev] of eventDB.entries()) {
        if (ev.options) {
            ev.options = ev.options.map(opt => {
                if (!eventDB.has(opt.nextEvent)) {
                    opt.nextEvent = 'M' + randInt(1,50);
                }
                return opt;
            });
        }
    }

    // ---------- 介面元素 ----------
    const statCoin = document.getElementById('statCoin');
    const statStamina = document.getElementById('statStamina');
    const statMind = document.getElementById('statMind');
    const eventDesc = document.getElementById('eventDesc');
    const eventTag = document.getElementById('eventTag');
    const optionsArea = document.getElementById('optionsArea');
    const resetBtn = document.getElementById('resetGameBtn');

    function updateStatsUI() {
        statCoin.innerText = state.coin;
        statStamina.innerText = state.stamina;
        statMind.innerText = state.mind;
    }

    function checkExtremeEnding() {
        if (state.stamina <= 0) return 'E2';
        if (state.mind <= 0) return 'E2';
        if (state.coin <= -150) return 'E7';
        if (state.coin >= 600) return 'E3';
        if (state.stamina >= 200) return 'E4';
        if (state.mind >= 180) return 'E12';
        return null;
    }

    function applyEffect(baseEffect) {
        // 先計算動態效果
        const effect = computeEffect(baseEffect);
        if (effect.coin) state.coin = Math.max(-999, Math.min(999, state.coin + effect.coin));
        if (effect.stamina) state.stamina = Math.max(0, Math.min(200, state.stamina + effect.stamina));
        if (effect.mind) state.mind = Math.max(0, Math.min(200, state.mind + effect.mind));
        updateStatsUI();

        const forcedEnd = checkExtremeEnding();
        if (forcedEnd) {
            state.currentEventId = forcedEnd;
        }
    }

    function loadEvent() {
        const ev = eventDB.get(state.currentEventId);
        if (!ev) {
            state.currentEventId = 'M1';
            loadEvent();
            return;
        }

        // 動態更新描述 (重新抓取當前狀態)
        let finalDesc = ev.desc;
        // 如果事件是主線且屬性較低，添加情緒描述
        if (ev.id.startsWith('M')) {
            if (state.coin < 20) finalDesc += ' 你摸著空空的錢包，更加焦慮。';
            else if (state.coin > 200) finalDesc += ' 你財大氣粗，走路有風。';
            if (state.stamina < 20) finalDesc += ' 你累得眼皮打架，卻不能停下。';
            if (state.mind < 20) finalDesc += ' 精神恍惚，你開始出現幻覺。';
        }
        eventDesc.innerText = finalDesc;
        eventTag.innerText = `#${ev.id} · ${ev.tag || '未知'}`;

        optionsArea.innerHTML = '';

        // 結局處理
        if (ev.id.startsWith('E')) {
            const msg = document.createElement('div');
            msg.style.padding = '20px';
            msg.style.textAlign = 'center';
            msg.style.color = '#b8a9c9';
            msg.style.fontStyle = 'italic';
            msg.innerText = '⭐ 旅程終點 · 點下方重啟按鈕展開新人生';
            optionsArea.appendChild(msg);
            if (!ev._applied) {
                const idx = parseInt(ev.id.substring(1)) - 1;
                if (endingList[idx]) {
                    applyEffect({
                        coin: endingList[idx].coin,
                        stamina: endingList[idx].stamina,
                        mind: endingList[idx].mind
                    });
                }
                ev._applied = true;
            }
            return;
        }

        // 過濾選項：只保留條件為true的
        const availableOptions = ev.options.filter(opt => checkCondition(opt.condition));

        availableOptions.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            // 計算預覽效果 (使用當前屬性計算)
            const previewEff = computeEffect(opt.baseEffect);
            const effText = ` [💰${previewEff.coin>0?'+':''}${previewEff.coin} ⚡${previewEff.stamina>0?'+':''}${previewEff.stamina} 🧠${previewEff.mind>0?'+':''}${previewEff.mind}]`;
            btn.innerText = opt.text + effText;
            btn.addEventListener('click', (e) => {
                applyEffect(opt.baseEffect);  // 使用基底效果，內部會再動態計算
                if (opt.nextEvent && eventDB.has(opt.nextEvent)) {
                    state.currentEventId = opt.nextEvent;
                } else {
                    state.currentEventId = 'M' + randInt(1,50);
                }
                const forced = checkExtremeEnding();
                if (forced) state.currentEventId = forced;
                loadEvent();
            });
            optionsArea.appendChild(btn);
        });

        // 如果沒有可用選項，提供一個默認選項返回主線
        if (availableOptions.length === 0) {
            const fallbackBtn = document.createElement('button');
            fallbackBtn.className = 'option-btn';
            fallbackBtn.innerText = '🚪 無路可走，回到主線';
            fallbackBtn.addEventListener('click', () => {
                state.currentEventId = 'M' + randInt(1,50);
                loadEvent();
            });
            optionsArea.appendChild(fallbackBtn);
        }
    }

    function resetGame() {
        state = {
            coin: 50,
            stamina: 50,
            mind: 50,
            currentEventId: 'M1'
        };
        for (let ev of eventDB.values()) {
            ev._applied = false;
        }
        updateStatsUI();
        loadEvent();
    }

    // 初始載入
    resetGame();
    resetBtn.addEventListener('click', resetGame);
})();
</script>
</body>
</html>
