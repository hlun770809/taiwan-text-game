<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <title>一萬塊的人生轉彎（進階時事版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #game {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin-bottom: 8px;
    }
    #stats {
      font-size: 0.9rem;
      color: #ccc;
      margin-bottom: 8px;
    }
    #story {
      white-space: pre-wrap;
      line-height: 1.6;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button.choice {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 4px;
      background: #333;
      color: #eee;
      font-size: 1rem;
      text-align: left;
    }
    button.choice:hover {
      background: #555;
      cursor: pointer;
    }
    button.choice:active {
      background: #777;
    }
    #restart {
      margin-top: 12px;
      padding: 8px 10px;
      background: #444;
      border: none;
      border-radius: 4px;
      color: #eee;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div id="game">
    <h1>一萬塊的人生轉彎（進階時事版）</h1>
    <div id="stats"></div>
    <div id="story"></div>
    <div class="choices" id="choices"></div>
    <button id="restart">重新開始</button>
  </div>
<body>
  <h1 style="color:white">測試文字</h1>
  <div id="game"> ...</div>
</body>


  <script>
    // 狀態
    const initialState = () => ({
      money: 3000,
      mental: 70,
      motherHealth: 50,
      fame: 0,
      corruption: false,
      trauma: false,
      joinedLazyCult: false,
      joinedSupportGroup: false,
      heroPotential: false,
      randomFlags: {},
      tagsScore: {
        lazy: 0,
        hero: 0,
        darkSpin: 0,
        family: 0,
        public: 0,
        media: 0
      },
      day: 1
    });

    let state = initialState();
    let currentScene = "intro";

    // 隨機事件
    const events = [
      // 基礎
      {
        id: "commute_001",
        tags: ["commute", "治安", "新聞"],
        weight: 1,
        text: s =>
          "捷運電視牆播放去年的北城車站隨機攻擊回顧專題，你突然想起地下街那晚的混亂。",
        effect: s => { s.trauma = true; s.mental -= 4; s.tagsScore.lazy += 1; }
      },
      {
        id: "commute_002",
        tags: ["commute"],
        weight: 1,
        text: s =>
          "車廂裡有人把座位讓給一位抱小孩的乘客，大家默默看著，空氣莫名溫暖了一點。",
        effect: s => { s.mental += 3; s.tagsScore.hero += 1; }
      },
      {
        id: "news_001",
        tags: ["新聞", "大罷免"],
        weight: 1,
        text: s =>
          "手機跳出推播：新一波罷免投票結果又全部未通過，政論節目吵成一團。",
        effect: s => { s.mental -= 2; s.tagsScore.lazy += 0.5; }
      },
      {
        id: "news_002",
        tags: ["新聞", "經濟"],
        weight: 1,
        text: s =>
          "新聞說關稅風暴後，股市盤中一度大跌又拉回，同事在茶水間大喊：「早知道就 all in」。",
        effect: s => { s.mental += 1; }
      },
      {
        id: "work_001",
        tags: ["work"],
        weight: 1,
        text: s =>
          "主管臨時叫你留下加班，說這是「一起度過難關」，但沒有提到加班費。",
        effect: s => { s.mental -= 6; s.tagsScore.lazy += 1; }
      },
      {
        id: "street_001",
        tags: ["street", "政治"],
        weight: 1,
        text: s =>
          "路口有造勢車經過，大聲喇叭吵得你頭痛，地上滿是旗子和面紙。",
        effect: s => { s.mental -= 2; }
      },
      {
        id: "late_001",
        tags: ["lateNight", "詐騙"],
        weight: 1,
        text: s =>
          "你收到一則可疑的投資 Line 群邀請，裡面滿是「財富自由」截圖與豪車照片。",
        effect: s => { s.mental -= 2; s.tagsScore.lazy += 0.5; }
      },
      // 時事事件（部分節錄）
      {
        id: "disaster_001",
        tags: ["新聞", "災難", "互助"],
        weight: 1,
        text: s =>
          "你看到新聞在報「東部山區堰塞湖潰堤」，一群被稱為『鏟子志工』的人，自發跑去幫忙清淤。",
        effect: s => { s.mental += 2; s.tagsScore.hero += 1.5; }
      },
      {
        id: "housing_001",
        tags: ["新聞", "房價", "青年"],
        weight: 1,
        text: s =>
          "新聞做了一個專題：「年輕人買房只剩夢？」畫面裡的受訪者年紀跟你差不多。",
        effect: s => { s.mental -= 3; s.tagsScore.lazy += 1; }
      },
      {
        id: "strait_001",
        tags: ["新聞", "軍演", "兩岸"],
        weight: 1,
        text: s =>
          "你看到新聞跑馬燈寫著「周邊海空又有大規模軍演」，有人在留言區開玩笑說今天該多喝一杯。",
        effect: s => { s.mental -= 3; s.tagsScore.lazy += 0.5; }
      },
      {
        id: "mental_002",
        tags: ["心理", "公共", "互助"],
        weight: 1,
        text: s =>
          "你在社團看到政府與民間合作的「青年免費諮商試辦計畫」，名額有限，但看起來是真的。",
        effect: s => { s.mental += 3; s.tagsScore.hero += 1; s.tagsScore.public += 1; }
      },
      {
        id: "media_001",
        tags: ["媒體", "政治", "網紅"],
        weight: 1,
        text: s =>
          "有知名網紅被抓包收錢帶風向，一夜之間從「良心頻道」變成「側翼代表」。",
        effect: s => { s.mental -= 2; s.tagsScore.media += 1; s.tagsScore.darkSpin += 1; }
      }
    ];

    function pickRandomEvent(tagFilters = [], maxPerRun = 1) {
      const pool = events.filter(ev => {
        if (tagFilters.length && !tagFilters.some(t => ev.tags.includes(t))) return false;
        const used = state.randomFlags[ev.id] || 0;
        return used < (ev.maxRepeat || 1);
      });
      if (!pool.length) return [];
      const picked = [];
      for (let i = 0; i < maxPerRun && pool.length; i++) {
        const total = pool.reduce((s, e) => s + (e.weight || 1), 0);
        let r = Math.random() * total;
        let idx = 0;
        for (let j = 0; j < pool.length; j++) {
          r -= (pool[j].weight || 1);
          if (r <= 0) { idx = j; break; }
        }
        const ev = pool[idx];
        state.randomFlags[ev.id] = (state.randomFlags[ev.id] || 0) + 1;
        picked.push(ev);
        pool.splice(idx, 1);
      }
      return picked;
    }

    // 場景
    const scenes = {
      intro: {
        text: () =>
`清晨 6 點，你擠在北城捷運的車廂裡。

手機跳出三則新聞：
1. 「史上最大普發現金一萬元今日入帳」
2. 「大罷免全數否決，藍綠互轟」
3. 「北城車站隨機攻擊事件一週年專題」`,
        choices: [
          { text: "忽略新聞，先想今天要怎麼活下去。", next: "toWork" },
          {
            text: "滑開留言區，看大家怎麼罵政客。",
            next: "politicStart",
            effect: () => { state.tagsScore.lazy += 0.5; }
          },
          {
            text: "截圖發限動，打字抱怨：「這國家完了。」",
            next: "influencerStart",
            effect: () => { state.fame += 10; state.tagsScore.media += 1; }
          }
        ]
      },

      toWork: {
        text: () => {
          let t = "你把手機關掉，決定先專心活過今天。\n\n到站後，你被人潮推著走出捷運站。";
          const evs = pickRandomEvent(["commute", "新聞"], 1);
          evs.forEach(ev => { ev.effect(state); t += "\n\n【通勤事件】" + ev.text(state); });
          t += "\n\n中午，公司群組傳來一片歡呼聲：「一萬元到了！」";
          return t;
        },
        choices: [{ text: "看看帳戶，確認一萬元真的進來了。", next: "moneyIn" }]
      },

      politicStart: {
        text: () =>
`你點開留言區，螢幕上全是謾罵和陰謀論。

有人說「大罷免就是一場笑話」，有人說「這國家只剩下鍵盤正義」。`,
        choices: [
          { text: "切換到網銀 app，看看那筆一萬元。", next: "moneyIn" },
          { text: "邊滑邊走出站，差點撞到人。", next: "toWork" }
        ]
      },

      influencerStart: {
        text: () => {
          state.day++;
          return "你的限動很快被一堆朋友回覆，有人按愛心，有人貼哭笑不得的貼圖。\n\n到了公司，中午群組炸開：「一萬元入帳啦！」";
        },
        choices: [{ text: "打開網銀，盯著那多出來的一萬元。", next: "moneyIn" }]
      },

      moneyIn: {
        text: () =>
`你的帳戶多了一行：「政府普發現金 +10,000」。

你原本只剩下 ${state.money} 元，突然覺得自己好像翻身了一點點。`,
        choices: [
          {
            text: "全部拿去還卡債。",
            next: "payDebt",
            effect: () => { state.money = 0; state.mental += 5; state.tagsScore.family += 0.5; }
          },
          {
            text: "晚上再來玩股市，先留著。",
            next: "planStock",
            effect: () => { state.money += 10000; }
          },
          {
            text: "揪同事去吃高級吃到飽。",
            next: "eatBuffet",
            effect: () => { state.money += 9200; state.mental += 10; }
          }
        ]
      },

      payDebt: {
        text: () =>
"你毫不猶豫把一萬元轉去繳卡債，帳戶又回到 0。\n\n下班時間到了，夜晚的北城風有點涼，你要怎麼回家？",
        choices: [
          { text: "走地下街捷徑。", next: "undergroundWarning" },
          { text: "走地面大馬路。", next: "safeWalk" }
        ]
      },

      planStock: {
        text: () =>
"你決定把一萬元留到晚上再說，心裡盤算著是不是該跟著新聞說的「關稅風暴」操作一波。\n\n下班時間到了，夜風冷得有點刺。",
        choices: [
          { text: "走地下街捷徑。", next: "undergroundWarning" },
          { text: "先去便利商店坐著想一想。", next: "convenienceStore" }
        ]
      },

      eatBuffet: {
        text: () =>
"你跟同事去高級吃到飽，聊股市、聊大罷免、聊誰都不相信。",
        choices: [
          { text: "回家路上走地下街。", next: "undergroundWarning" },
          {
            text: "搭計程車回家。",
            next: "taxiHome",
            effect: () => { state.money -= 200; }
          }
        ]
      },

      convenienceStore: {
        text: () => {
          let t = "你買了一杯熱咖啡，坐在便利商店的窗邊，看著路人來來往往。";
          const evs = pickRandomEvent(["news", "房價", "災難"], 1);
          evs.forEach(ev => { ev.effect(state); t += "\n\n【新聞事件】" + ev.text(state); });
          return t;
        },
        choices: [
          { text: "喝完咖啡，走地下街回家。", next: "undergroundWarning" },
          { text: "慢慢走回家，順便散步。", next: "safeWalk" }
        ]
      },

      taxiHome: {
        text: () =>
"司機一路抱怨房價、抱怨政府、抱怨治安，你有一搭沒一搭地回應。",
        choices: [
          { text: "打開股市 app，打算小試身手。", next: "stockNight" },
          { text: "累了，決定先睡一覺再說。", next: "lateNightScroll" }
        ]
      },

      safeWalk: {
        text: () => {
          let t = "你選擇走地面大馬路，路燈亮著，車子來來往往。";
          const evs = pickRandomEvent(["street"], 1);
          evs.forEach(ev => { ev.effect(state); t += "\n\n【街頭事件】" + ev.text(state); });
          return t;
        },
        choices: [
          { text: "拿一部分去投資股市。", next: "stockNight" },
          { text: "上網搜尋「窮人翻身方法」。", next: "searchHelp" }
        ]
      },

      undergroundWarning: {
        text: () =>
"你走向北城車站地下街入口。\n\n入口旁貼著一張海報：「北城車站隨機攻擊事件一週年紀念座談」。",
        choices: [
          { text: "還是走地下街。", next: "undergroundEvent" },
          { text: "臨時改變心意，繞遠路走地面。", next: "safeWalk" }
        ]
      },

      undergroundEvent: {
        text: () => {
          state.trauma = true;
          state.mental -= 20;
          state.heroPotential = true;
          state.tagsScore.hero += 1;
          return "你走進地下街，前方傳來尖叫與騷動，有人喊「快跑！」。";
        },
        choices: [
          {
            text: "拉住身旁的小孩，一起躲進店裡。",
            next: "heroBranch",
            effect: () => { state.tagsScore.hero += 2; }
          },
          {
            text: "自己先跑。",
            next: "escapeAlone",
            effect: () => { state.tagsScore.lazy += 1.5; }
          },
          {
            text: "拿出手機錄影，上傳限動。",
            next: "recordEvent",
            effect: () => { state.fame += 20; state.tagsScore.media += 2; }
          }
        ]
      },

      heroBranch: {
        text: () =>
"你把小孩拉進還亮著燈的店裡，外面吵了很久，終於警笛聲響起。",
        choices: [
          { text: "默默離開現場。", next: "searchHelp" },
          {
            text: "接受媒體訪問。",
            next: "startInfluencer",
            effect: () => { state.fame += 30; state.tagsScore.media += 1; }
          }
        ]
      },

      escapeAlone: {
        text: () =>
"你頭也不回地往出口狂奔，回到房間後，手還在抖。",
        choices: [
          { text: "打開社群，看大家在討論這件事。", next: "searchHelp" },
          { text: "假裝什麼都沒發生，直接睡覺。", next: "lateNightScroll" }
        ]
      },

      recordEvent: {
        text: () =>
"你的影片短時間內破千觀看，有人稱讚你勇敢，有人罵你冷血。",
        choices: [
          { text: "繼續追蹤新聞與留言。", next: "searchHelp" },
          { text: "關掉手機，努力睡覺。", next: "lateNightScroll" }
        ]
      },

      searchHelp: {
        text: () =>
"你開始搜尋「創傷」、「免費諮商」、「社福資源」，資訊多到爆炸。",
        choices: [
          {
            text: "加入「躺平無罪聯盟」。",
            next: "lazyCult",
            effect: () => { state.joinedLazyCult = true; state.mental -= 5; state.tagsScore.lazy += 3; }
          },
          {
            text: "加入「月光族自救會」。",
            next: "supportGroup",
            effect: () => { state.joinedSupportGroup = true; state.mental += 5; state.tagsScore.hero += 2; }
          }
        ]
      },

      lazyCult: {
        text: () =>
"躺平無罪聯盟的貼文寫著：「努力只是幫別人賺更多而已。」",
        choices: [
          {
            text: "深入參與，開始每天發負面文。",
            next: "endingLazyWalk",
            effect: () => { state.tagsScore.lazy += 2; state.mental -= 5; }
          },
          {
            text: "只是潛水，後悔加入。",
            next: "lateNightScroll"
          }
        ]
      },

      supportGroup: {
        text: () =>
"自救會成員分享租屋陷阱、打工經驗，也談心理諮商與社福資源。",
        choices: [
          {
            text: "主動發文分享自己的處境。",
            next: "workAndFamily",
            effect: () => { state.tagsScore.hero += 2; state.mental += 5; }
          },
          { text: "先潛水，看別人的故事。", next: "workAndFamily" }
        ]
      },

      stockNight: {
        text: () => {
          let t = "你打開股市 app，盯著 K 線發呆。\n";
          const sign = Math.random() < 0.5 ? -1 : 1;
          const amt = 1000 + Math.floor(Math.random() * 2000);
          state.money += sign * amt;
          state.mental += sign * 3;
          t += `\n【股市變化】你這一晚${sign > 0 ? "小賺" : "慘賠"} ${amt} 元。`;
          return t;
        },
        choices: [
          { text: "不管結果如何，先睡覺。", next: "lateNightScroll" },
          {
            text: "越想越不甘心，繼續盯盤。",
            next: "lateNightScroll",
            effect: () => { state.mental -= 5; }
          }
        ]
      },

      lateNightScroll: {
        text: () => {
          let t = "深夜，你躺在床上滑手機，演算法不停推送災難與股市預言。";
          const evs = pickRandomEvent(["lateNight", "心理", "新聞"], 1);
          evs.forEach(ev => { ev.effect(state); t += "\n\n【深夜事件】" + ev.text(state); });
          return t;
        },
        choices: [{ text: "終於累了，睡著了。", next: "morningCall" }]
      },

      morningCall: {
        text: () =>
"清晨六點半，手機響起，是高雄家裡打來的電話。",
        choices: [
          { text: "趕快接起來。", next: "callMom" },
          {
            text: "按掉，等等再回。",
            next: "workAndFamily",
            effect: () => { state.mental -= 10; state.tagsScore.lazy += 1; }
          }
        ]
      },

      callMom: {
        text: () =>
"媽媽說身體愈來愈差，問你有沒有想過回去陪她。",
        choices: [
          {
            text: "答應過一陣子就回去。",
            next: "workAndFamily",
            effect: () => { state.tagsScore.family += 2; }
          },
          {
            text: "說自己還在打拚，叫她先撐著。",
            next: "workAndFamily",
            effect: () => { state.mental -= 5; state.tagsScore.lazy += 0.5; }
          }
        ]
      },

      workAndFamily: {
        text: () => {
          let t = "你在工作、家人、社團之間掙扎了好一陣子。";
          const evs = pickRandomEvent(["work", "勞工"], 1);
          evs.forEach(ev => { ev.effect(state); t += "\n\n【工作事件】" + ev.text(state); });
          t += "\n\n某天，一個神秘帳號加你好友，自稱是「社群小編招募」。";
          return t;
        },
        choices: [
          { text: "聽聽對方要說什麼。", next: "darkJobOffer" },
          { text: "直接封鎖，專心顧家人。", next: "towardEnding" }
        ]
      },

      darkJobOffer: {
        text: () =>
"對方說，只要幫某些議題寫貼文、帶風向，每個月就有額外一萬五。",
        choices: [
          {
            text: "點頭答應。",
            next: "endingDarkSpin",
            effect: () => { state.corruption = true; state.money += 15000; state.tagsScore.darkSpin += 3; }
          },
          { text: "拒絕，覺得很噁心。", next: "towardEnding" }
        ]
      },

      towardEnding: {
        text: () =>
"時間在混亂中前進，你知道接下來的選擇會把你推向不同的人生。",
        choices: [
          {
            text: "面對自己的選擇，迎接結局。",
            next: null,
            effect: () => { currentScene = decideEnding(); }
          }
        ]
      },

      // 結局們
      endingLazyWalk: {
        text: () =>
"你跟著躺平無罪聯盟的一群人，坐車來到海邊，準備走向一場「最後的散步」。\n\n【結局一：躺平集體出走】",
        choices: []
      },

      endingDarkSpin: {
        text: () =>
"你成為某一個陣營的王牌側翼小編，薪水破百，卻每天在語言與事實之間遊走。\n\n【結局二：資訊戰的操盤手】",
        choices: []
      },

      endingHomeShop: {
        text: () =>
"你最後選擇回南部，和媽媽一起在市場口開了一間小早餐店。\n\n【結局三：平凡卻踏實的日常】",
        choices: []
      },

      endingDebtLoop: {
        text: () =>
"你在房租與債務之間打轉，某天又看到政府宣布普發現金。\n\n螢幕跳出小字：「你要再賭一次嗎？」\n\n【結局四：股海與債務的輪迴】",
        choices: []
      },

      endingInfluencer: {
        text: () =>
"你成為專門談社會現象與基層生活的網紅，夾在演算法與現實之間。\n\n【結局五：灰階世界的說書人】",
        choices: []
      },

      endingCandidate: {
        text: () =>
"自救會的夥伴拱你出來選里長／議員，你貼上人生第一張競選海報。\n\n【結局六：從鍵盤到街頭的候選人】",
        choices: []
      },

      endingHero: {
        text: () =>
"幾年後，有人拍了一部關於「平凡英雄」的小紀錄片，你只是裡面其中一個普通人。\n\n【結局七：北城地下街的小小英雄】",
        choices: []
      }
    };

    function decideEnding() {
      const s = state, cands = [];
      if (s.tagsScore.lazy >= 5 && s.mental <= 30) cands.push({ ending: "endingLazyWalk", weight: s.tagsScore.lazy + 2 });
      if (s.tagsScore.hero >= 4 && s.joinedSupportGroup) cands.push({ ending: "endingHero", weight: s.tagsScore.hero + s.motherHealth / 20 });
      if (s.corruption && s.tagsScore.darkSpin >= 3) cands.push({ ending: "endingDarkSpin", weight: s.tagsScore.darkSpin + s.fame / 20 });
      if (s.tagsScore.family >= 3 && s.motherHealth >= 40) cands.push({ ending: "endingHomeShop", weight: s.tagsScore.family + s.motherHealth / 20 });
      if (s.tagsScore.public >= 3 && s.fame >= 40 && !s.corruption) cands.push({ ending: "endingCandidate", weight: s.tagsScore.public + s.fame / 30 });
      if (s.tagsScore.media >= 3 && s.fame >= 60) cands.push({ ending: "endingInfluencer", weight: s.tagsScore.media + s.fame / 20 });
      if (s.money <= 0) cands.push({ ending: "endingDebtLoop", weight: 3 });
      if (!cands.length) return "endingDebtLoop";
      let total = cands.reduce((sum, c) => sum + c.weight, 0);
      let r = Math.random() * total;
      for (const c of cands) { r -= c.weight; if (r <= 0) return c.ending; }
      return cands[cands.length - 1].ending;
    }

    function render() {
      const storyEl = document.getElementById("story");
      const choicesEl = document.getElementById("choices");
      const statsEl = document.getElementById("stats");
      const restartBtn = document.getElementById("restart");

      statsEl.textContent =
        `現金：${state.money}｜精神：${state.mental}｜媽媽健康：${state.motherHealth}｜知名度：${state.fame}`;

      const scene = scenes[currentScene];
      if (!scene) {
        storyEl.textContent = "（錯誤：找不到場景 " + currentScene + "）";
        choicesEl.innerHTML = "";
        restartBtn.style.display = "inline-block";
        return;
      }

      storyEl.textContent = typeof scene.text === "function" ? scene.text() : scene.text;
      choicesEl.innerHTML = "";

      if (scene.choices && scene.choices.length) {
        restartBtn.style.display = "none";
        scene.choices.forEach(choice => {
          const btn = document.createElement("button");
          btn.className = "choice";
          btn.textContent = choice.text;
          btn.onclick = () => {
            if (choice.effect) choice.effect();
            let nextKey = choice.next;
            if (choice.randomNext && choice.randomNext.length) {
              let r = Math.random();
              for (const rn of choice.randomNext) {
                r -= rn.prob;
                if (r <= 0) { nextKey = rn.next; break; }
              }
            }
            state.mental = Math.max(0, Math.min(100, state.mental));
            state.motherHealth = Math.max(0, Math.min(100, state.motherHealth));
            if (nextKey) currentScene = nextKey;
            render();
          };
          choicesEl.appendChild(btn);
        });
      } else {
        restartBtn.style.display = "inline-block";
      }
    }

    document.getElementById("restart").onclick = () => {
      state = initialState();
      currentScene = "intro";
      render();
    };

    render();
  </script>
</body>
</html>
